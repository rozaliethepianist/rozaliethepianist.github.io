
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rozalie the Pianist</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f3ec;
      color: #252525;
      font-family: Georgia, serif;
      text-align: center;
    }

    main { padding: 24px; }

    h1 {
      font-size: clamp(36px, 7vw, 68px);
      font-weight: normal;
      letter-spacing: 2px;
      margin: 0 0 24px;
    }

    .line {
      width: 50px;
      height: 1px;
      background: #a68b70;
      margin: 0 auto 24px;
    }

    p {
      font: 12px Arial, sans-serif;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #8b7d70;
    }
  </style>
</head>
<body>
  <main>
    <h1>Rozalie the Pianist</h1>
    <div class="line"></div>
    <p>Work in progress</p>
  </main>
</body>
</html>
